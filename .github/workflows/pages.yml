name: Deploy Ship Log to GitHub Pages

# 上线前只允许手动触发；准备发布时把下面的 push 触发器取消注释，
# 并在仓库 Settings → Pages → Source 选择 GitHub Actions。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "shiplog/**"
  #     - "figures/**"
  #     - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shiplog/requirements.txt
      - run: pip install -r shiplog/requirements.txt
      - run: python shiplog/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shiplog/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
