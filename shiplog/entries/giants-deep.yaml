- id: gd-charged-core
  title: 带电的核心
  question: 深巨星的核心要带多少电荷，才能把一艘飞船挡在电流层之外？这些电荷在导电的海水里能维持多久不被中和？
  location: giants-deep
  domain: [electrodynamics]
  status: explored
  more_to_explore: true
  updated: 2026-09-18
  thumbnail: figures/gd-charged-core.png
  links:
    notebook: labs/giants-deep/charged_shell.py
    chapter: book/chapters/giants-deep.tex
    exercises: exercises/giants-deep.md
  facts:
    - kind: result
      text: 高斯定律：均匀带电球壳内部 E = 0，外部 E = Q/(4πε₀r²)，与把全部电荷放在球心的点电荷无法区分。
    - kind: result
      text: 把核心视作球形导体：电容 C = 4πε₀R 与半径成正比，静电能 U = Q²/(2C)。
    - kind: result
      text: 电荷弛豫时间 τ = ε/σ。海水 σ ≈ 5 S/m，τ ~ 10⁻¹⁰ s——任何净电荷在导电海洋里不到一纳秒就被中和。
    - kind: result
      text: 结论：能长期存在的不是整体净电荷，而是靠持续电流维持的电势差。问题被推向等离子体与发电机。
    - kind: rumor
      text: 如果海洋和大气是等离子体，Debye 屏蔽会不会把场压回核心附近？
    - kind: rumor
      text: 如果核心在旋转，会产生怎样的磁场？
  leads_to:
    - {to: gd-debye,            type: deepen}
    - {to: gd-rotating-shell,   type: deepen}
    - {to: gd-lightning-budget, type: deepen}
    - {to: gd-jellyfish,        type: contradiction}
    - {to: bh-shell-theorem,    type: analogy, note: 高斯定律 ↔ 壳层定理}

